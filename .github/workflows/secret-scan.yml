name: Secret scan

# Scans the commits each push or pull request adds, with Gitleaks' default
# rules. Findings are redacted in the log. Older history was reviewed
# manually and is not rescanned here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (official release, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$AFTER"
          elif git rev-parse --verify -q "origin/$DEFAULT_BRANCH" >/dev/null && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            # New branch: only the commits it adds on top of the default branch.
            range="origin/$DEFAULT_BRANCH..$AFTER"
          else
            # First push of the default branch: scan everything.
            range="$AFTER"
          fi
          echo "Scanning $range"
          gitleaks git --log-opts="$range" --redact --no-banner --verbose --exit-code 1
